name: Build and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write
  packages: write
  actions: read
  security-events: write

env:
  FLUTTER_VERSION: "3.47.5"
  JAVA_VERSION: "17"
  NODE_VERSION: "24"
  APPIMAGETOOL_VERSION: "1.9.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # Inject Firebase config before anything Flutter touches
      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode \
            > android/app/google-services.json
      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Cache Flutter Pub
        uses: actions/cache@v4.2.0
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            flutter-pub-
      - name: Get dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze --fatal-infos

      # A failing test now fails the job. Previously the failure was swallowed
      # by `|| echo` and continue-on-error, so a red test never blocked a build.
      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v5.5.2
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  # Informational only. It pings the production server, so it must never be
  # able to block a build: a sleeping or down Render instance says nothing
  # about whether the app compiles. continue-on-error keeps the job green.
  check-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check backend status
        run: |
          echo "Checking backend endpoints..."
          check_endpoint() {
            local url="$1"
            local name="$2"
            local max_attempts=5
            local wait_time=15
            for i in $(seq 1 $max_attempts); do
              echo "Checking $name (attempt $i/$max_attempts)..."
              if curl -sSf --max-time 30 --retry 3 "$url" > /dev/null 2>&1; then
                echo "$name endpoint working"
                return 0
              elif [ $i -eq $max_attempts ]; then
                echo "$name endpoint failed after $max_attempts attempts"
                return 1
              else
                echo "Waiting ${wait_time}s before retry..."
                sleep $wait_time
              fi
            done
          }
          check_endpoint "https://momentum-g7ah.onrender.com" "Wake-up"
          echo "Allowing backend time to fully initialize..."
          sleep 30
          check_endpoint "https://momentum-g7ah.onrender.com/health" "Health"
          echo "Backend status check completed successfully"

  build:
    # Gated on code quality only; see check-backend above.
    needs: [code-quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
            output: apk
          - os: ubuntu-latest
            platform: web
            output: web
          - os: ubuntu-latest
            platform: linux
            output: tar.gz + AppImage
          - os: windows-latest
            platform: windows
            output: exe
          - os: macos-latest
            platform: ios
            output: simulator
          - os: macos-latest
            platform: macos
            output: app

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4.2.2

      # Firebase config — Android
      # Runs on every platform job but only writes the file when the secret
      # exists AND we are on a platform that needs it.  The `if` guards
      # prevent the step from hard-failing on platforms where the secret is
      # irrelevant (windows / web / linux).
      - name: Create google-services.json (Android)
        if: matrix.platform == 'android'
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode \
            > android/app/google-services.json
      # Firebase config — iOS
      - name: Create GoogleService-Info.plist (iOS)
        if: matrix.platform == 'ios'
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_PLIST }}" | base64 --decode \
            > ios/Runner/GoogleService-Info.plist
      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4.2.0
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Cache Flutter Pub
        uses: actions/cache@v4.2.0
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            flutter-pub-
      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-
      - name: Platform Setup
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            android)
              yes | flutter doctor --android-licenses || true
              ;;
            web)
              flutter config --enable-web
              ;;
            linux)
              flutter config --enable-linux-desktop
              ;;
            windows)
              flutter config --enable-windows-desktop
              ;;
            ios)
              flutter config --enable-ios
              ;;
            macos)
              flutter config --enable-macos-desktop
              ;;
          esac
      # Linux desktop build dependencies
      # Standard Flutter linux-desktop toolchain, plus libsecret/jsoncpp
      # which flutter_secure_storage_linux needs at build time.
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libsecret-1-dev \
            libjsoncpp-dev
      - name: Setup iOS Simulator
        if: matrix.platform == 'ios'
        run: |
          echo "📱 Setting up iOS Simulator with compatible version..."
          echo "Available simulators:"
          xcrun simctl list devices available
          echo "Available runtimes:"
          xcrun simctl list runtimes
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone.*\(iOS 17\.[0-9]+\)" | head -1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/' | tr -d ' ')
          if [ -z "$DEVICE_ID" ]; then
            echo "No iOS 17 simulator found, using any available iPhone..."
            DEVICE_ID=$(xcrun simctl list devices available | grep iPhone | head -1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/' | tr -d ' ')
          fi
          if [ -n "$DEVICE_ID" ]; then
            echo "Selected simulator: $DEVICE_ID"
            echo "IOS_SIMULATOR_ID=$DEVICE_ID" >> $GITHUB_ENV
            xcrun simctl boot "$DEVICE_ID" || echo "Simulator may already be booted"
            sleep 30
            xcrun simctl list devices | grep "$DEVICE_ID"
          else
            echo "No suitable iOS simulator found"
            exit 1
          fi
      - name: Get dependencies
        run: flutter pub get

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Build Application
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            android)
              flutter build apk --release --split-per-abi
              flutter build appbundle --release
              ;;
            web)
              flutter build web --release
              ;;
            linux)
              flutter build linux --release
              ;;
            windows)
              flutter build windows --release
              ;;
            ios)
              echo "Building iOS app..."
              if [ -n "$IOS_SIMULATOR_ID" ]; then
                echo "Building for specific simulator: $IOS_SIMULATOR_ID"
                if xcrun simctl list devices | grep -q "$IOS_SIMULATOR_ID"; then
                  flutter build ios --simulator --no-codesign --device-id="$IOS_SIMULATOR_ID"
                else
                  flutter build ios --simulator --no-codesign
                fi
              else
                flutter build ios --simulator --no-codesign
              fi
              ;;
            macos)
              flutter build macos --release
              ;;
          esac
      - name: Install zip (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Package Build
        shell: bash
        run: |
          mkdir -p releases
          case "${{ matrix.platform }}" in
            android)
              cp build/app/outputs/flutter-apk/*.apk releases/
              cp build/app/outputs/bundle/release/*.aab releases/
              ;;
            web)
              cd build/web && zip -r "../../releases/momentum-web-${{ github.sha }}.zip" .
              ;;
            linux)
              cd build/linux/x64/release/bundle
              tar -czf "../../../../../releases/momentum-linux-${{ github.sha }}.tar.gz" .
              ;;
            windows)
              pwsh -Command "Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'releases/momentum-windows-${{ github.sha }}.zip'"
              ;;
            ios)
              if [ -d "build/ios/iphonesimulator" ] && [ "$(ls -A build/ios/iphonesimulator 2>/dev/null)" ]; then
                cd build/ios/iphonesimulator
                zip -r "../../../releases/momentum-ios-simulator-${{ github.sha }}.zip" .
              else
                echo "iOS build directory not found" > "releases/momentum-ios-simulator-${{ github.sha }}.txt"
              fi
              ;;
            macos)
              if [ -d "build/macos/Build/Products/Release" ] && [ "$(ls -A build/macos/Build/Products/Release 2>/dev/null)" ]; then
                cd build/macos/Build/Products/Release
                zip -r "../../../../../releases/momentum-macos-${{ github.sha }}.zip" .
              else
                echo "macOS build directory not found" > "releases/momentum-macos-${{ github.sha }}.txt"
              fi
              ;;
          esac
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: momentum-${{ matrix.platform }}-${{ github.sha }}
          path: releases/
          if-no-files-found: error
          retention-days: 30

      # AppImage — Linux only. This is a step inside the Linux matrix job, not
      # a separate job, so the job count does not change. It is its own step
      # and its own artifact so it is easy to find and fails loudly: the step
      # errors out if the file is not produced.
      - name: Build AppImage (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euxo pipefail
          bundle=build/linux/x64/release/bundle
          out="appimage/momentum-linux-${GITHUB_SHA}-x86_64.AppImage"

          test -x "$bundle/momentum"
          rm -rf AppDir appimage
          mkdir -p AppDir/usr/bin appimage

          cp -r "$bundle/." AppDir/usr/bin/
          cp assets/images/momentum_app_logo_main.png AppDir/momentum.png

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Momentum' \
            'Comment=Smart daily task manager with team collaboration' \
            'Exec=momentum' \
            'Icon=momentum' \
            'Categories=Office;ProjectManagement;' \
            'Terminal=false' > AppDir/momentum.desktop

          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/momentum" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun

          # Pinned release, not the moving "continuous" tag, so a change
          # upstream cannot break or alter the build.
          curl -fsSL \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage" \
            -o appimagetool
          chmod +x appimagetool

          # APPIMAGE_EXTRACT_AND_RUN lets the tool run without FUSE, which
          # GitHub-hosted runners do not provide.
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool -n AppDir "$out"

          ls -lh appimage
          test -s "$out"

      - name: Upload AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4.4.3
        with:
          name: momentum-linux-appimage-${{ github.sha }}
          path: appimage/
          if-no-files-found: error
          retention-days: 30

  release:
    if: always() && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          path: artifacts/
      - name: Prepare Release Files
        run: |
          mkdir -p release-files
          find artifacts/ -type f -exec cp {} release-files/ \;
          # Artifact zips drop the executable bit.
          chmod +x release-files/*.AppImage 2>/dev/null || true
          echo "Release files ready:"
          ls -la release-files/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          name: Release ${{ github.ref_name }}
          body: |
            ## Momentum Release ${{ github.ref_name }}
            ### Downloads
            - Android APK / AAB
            - Web
            - Linux (tar.gz and AppImage)
            - Windows
            - iOS Simulator
            - macOS
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-web:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Web Artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          name: momentum-web-${{ github.sha }}
          path: web-build/

  notify:
    if: always()
    needs: [code-quality, backend, check-backend, build, release]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Build Status
        run: |
          echo "code-quality:      ${{ needs.code-quality.result }}"
          echo "backend:           ${{ needs.backend.result }}"
          echo "check-backend:     ${{ needs.check-backend.result }} (informational)"
          echo "build:             ${{ needs.build.result }}"
          if [ "${{ needs.code-quality.result }}" = "success" ] \
            && [ "${{ needs.backend.result }}" = "success" ] \
            && [ "${{ needs.build.result }}" = "success" ]; then
            echo "Build completed successfully"
          else
            echo "Build failed"
            exit 1
          fi
